<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Illustration of a meetinghouse with a steeple">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1010" cy="120" r="64" fill="#fde68a"/>

  <!-- Clouds -->
  <ellipse cx="260" cy="120" rx="90" ry="26" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="320" cy="105" rx="55" ry="20" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="780" cy="180" rx="80" ry="22" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="840" cy="168" rx="45" ry="16" fill="#ffffff" opacity="0.6"/>

  <!-- Distant hill -->
  <path d="M0 470 C260 380 520 500 780 430 C900 400 1060 440 1200 410 V630 H0 Z" fill="#a7f3d0"/>

  <!-- Grass -->
  <rect y="470" width="1200" height="160" fill="url(#grass)"/>

  <!-- Soft ground shadow under the chapel -->
  <ellipse cx="600" cy="532" rx="300" ry="26" fill="#4ade80" opacity="0.4"/>

  <!-- Chapel -->
  <!-- Sidewalk -->
  <path d="M540 532 h120 v70 a16 16 0 0 1 -16 16 h-88 a16 16 0 0 1 -16 -16 Z" fill="#d4d4d8" opacity="0.85"/>

  <!-- Steps -->
  <rect x="500" y="500" width="200" height="24" rx="4" fill="#d4d4d8"/>
  <rect x="524" y="482" width="152" height="20" rx="3" fill="#e4e4e7"/>

  <!-- Building body -->
  <rect x="360" y="246" width="480" height="258" fill="#fafafa"/>
  <rect x="360" y="246" width="480" height="10" fill="#e2e8f0"/>
  <rect x="376" y="256" width="10" height="248" fill="#e2e8f0"/>
  <rect x="814" y="256" width="10" height="248" fill="#e2e8f0"/>

  <!-- Parapet and gabled roof -->
  <rect x="346" y="224" width="508" height="20" fill="#cbd5e1"/>
  <polygon points="360,246 600,150 840,246" fill="#e2e8f0"/>
  <path d="M600 150 L840 246 H784 L600 168 Z" fill="#cbd5e1"/>

  <!-- Steeple -->
  <rect x="572" y="92" width="56" height="82" fill="#cbd5e1"/>
  <rect x="584" y="120" width="8" height="22" fill="#ffffff" opacity="0.85"/>
  <rect x="608" y="120" width="8" height="22" fill="#ffffff" opacity="0.85"/>
  <polygon points="600,18 572,92 628,92" fill="#94a3b8"/>
  <circle cx="600" cy="14" r="6" fill="#fbbf24"/>

  <!-- Rose window -->
  <circle cx="600" cy="330" r="82" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="600" cy="330" r="58" fill="#0ea5e9"/>
  <path d="M600 272 v96 M600 330 h-52 M600 330 h52 M560 290 l34 34 M640 290 l-34 34 M560 370 l34 -34 M640 370 l-34 -34" stroke="#bde8ff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="330" r="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>

  <!-- Arched windows -->
  <path d="M396 424 v-88 a38 38 0 0 1 76 0 v88 Z" fill="#dbeafe" stroke="#cbd5e1" stroke-width="5"/>
  <path d="M434 336 v88" stroke="#cbd5e1" stroke-width="5"/>
  <path d="M728 424 v-88 a38 38 0 0 1 76 0 v88 Z" fill="#dbeafe" stroke="#cbd5e1" stroke-width="5"/>
  <path d="M766 336 v88" stroke="#cbd5e1" stroke-width="5"/>

  <!-- Door -->
  <path d="M530 504 v-86 a70 70 0 0 1 140 0 v86 Z" fill="#78350f"/>
  <path d="M538 504 v-62 a62 62 0 0 1 124 0 v62 Z" fill="#92400e"/>
  <circle cx="649" cy="470" r="5" fill="#fbbf24"/>
  <path d="M600 442 v62" stroke="#78350f" stroke-width="3"/>
</svg>